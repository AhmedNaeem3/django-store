<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Products</title>
</head>
<body>
    <h1>All Products</h1>

    {% for product in products %}
        <div>
            <h2>
                <a href="{% url 'product_detail' product.id %}">
                    {{ product.name }}
                </a>
            </h2>

            <p>Price: {{ product.price }}</p>
            <p>Stock: {{ product.stock }}</p>
        </div>
        <hr>
    {% empty %}
        <p>No products found.</p>
    {% endfor %}
</body>
</html>
