<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login to Django Store</h1>

    {% if form.errors %}
        <p>Invalid username or password. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="id_username">Username:</label>
            <input
                type="text"
                name="username"
                id="id_username"
                required
            >
        </div>

        <br>

        <div>
            <label for="id_password">Password:</label>
            <input
                type="password"
                name="password"
                id="id_password"
                required
            >
        </div>

        <br>

        <button type="submit">Login</button>
    </form>
</body>
</html>
